name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Builds and tests every Stonecutter node (Minecraft version x loader)
      - name: Build and test
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: sun-orientation
          path: versions/*/build/libs/*.jar
