plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Mod Menu (only to compile the integration; not a dependency of the mod)
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // No Fabric API or Iris as required dependencies.
    // The Iris mixins target classes by name and are skipped when Iris is missing.

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed"
    }
}

// ---------------------------------------------------------------------------
// In-game test (Fabric client gametest). Development only: none of this goes into the .jar.
//   gradlew runClientGameTest -Psunorientation.variant=vanilla|iris|nuit|iris-nuit|gallery|gallery-vanilla
// Third-party jars are read from ../_shared/testenv/ (or -Ptestenv_dir=...), not versioned:
//   testenv/mods-iris/    Iris + Sodium        testenv/mods-nuit/   Nuit
//   testenv/mods-extra/   mods that are always loaded (e.g. Mod Menu)
//   testenv/shaderpacks/  shader pack enabled with Iris (the first one found)
// ---------------------------------------------------------------------------
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "sun_orientation_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
    }
}

dependencies {
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def gameTestRunDir = file("build/run/clientGameTest")
// Test jars and packs shared between mods (not versioned): ../_shared/testenv by default.
def testEnv = providers.gradleProperty("testenv_dir").orElse("../_shared/testenv").get()
def gameTestVariant = providers.gradleProperty("sunorientation.variant").orElse("vanilla")

tasks.register("prepareGameTest") {
    def variant = gameTestVariant.get()
    def withIris = variant.contains("iris") || variant == "gallery"
    def withNuit = variant.contains("nuit")
    inputs.property("variant", variant)
    outputs.upToDateWhen { false }
    doLast {
        project.delete(gameTestRunDir)
        project.copy {
            from(file("${testEnv}/mods-iris")) { include withIris ? "*.jar" : "__none__" }
            from(file("${testEnv}/mods-nuit")) { include withNuit ? "*.jar" : "__none__" }
            from(file("${testEnv}/mods-extra")) { include "*.jar" }
            into(new File(gameTestRunDir, "mods"))
        }
        if (withIris) {
            def packs = file("${testEnv}/shaderpacks").listFiles()?.findAll { it.name.endsWith(".zip") } ?: []
            if (packs.isEmpty()) {
                throw new GradleException("Missing a shader pack in testenv/shaderpacks")
            }
            project.copy { from(packs[0]); into(new File(gameTestRunDir, "shaderpacks")) }
            def cfg = new File(gameTestRunDir, "config/iris.properties")
            cfg.parentFile.mkdirs()
            cfg.text = "enableShaders=true\nshaderPack=${packs[0].name}\ndisableUpdateMessage=true\n"
        }
        logger.lifecycle("In-game test, variant '${variant}': " +
            (new File(gameTestRunDir, "mods").list()?.join(", ") ?: "no extra mods"))
    }
}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
    dependsOn "prepareGameTest"
    jvmArgs "-Dmixin.debug.countInjections=true", "-Dsunorientation.variant=${gameTestVariant.get()}"
}

processResources {
    def version = project.version
    def repo = providers.gradleProperty("github_repo").orElse("").get()
    def contact = ["homepage": "https://modrinth.com/mod/sun-orientation"]
    if (!repo.isEmpty()) {
        contact["sources"] = "https://github.com/" + repo
        contact["issues"] = "https://github.com/" + repo + "/issues"
    }
    def contactJson = groovy.json.JsonOutput.toJson(contact)
    inputs.property 'version', version
    inputs.property 'contact', contactJson
    filesMatching('fabric.mod.json') {
        expand version: version, contact: contactJson
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.base.archivesName.get()
    inputs.property "projectName", projectName
    from("LICENSE") {
        rename { "${it}_${projectName}" }
    }
}

// Every build also leaves a copy of the mod jar in release/ for easy access.
tasks.named("build") {
    def releaseDir = file("release")
    def jarFile = tasks.named("jar").flatMap { it.archiveFile }
    doLast {
        project.copy {
            from(jarFile)
            into(releaseDir)
        }
    }
}
