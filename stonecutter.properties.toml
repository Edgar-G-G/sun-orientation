# Mod properties shared by every build node, then per Minecraft version and per loader + version.
mod.id = "sun_orientation"
mod.version = "1.1.0"
mod.group = "es.sunorientation"
mod.archives_name = "sun-orientation"
# GitHub repository (user/repo) for the links in the mod metadata; empty = no links.
mod.github_repo = "Edgar-G-G/sun-orientation"

deps.junit = "5.13.4"
deps.fabric_loader = "0.19.5"
# Only to check the Fabric jar on Quilt (-Psunorientation.quilt)
deps.quilt_loader = "0.31.0-beta.4"

["26.3"]
# Minecraft releases the jar is marked compatible with in the stores
mod.mc_releases = ["26.3"]

[fabric."26.3"]
# Minecraft range in fabric.mod.json
mod.mc_compat = "~26.3"
deps.fabric_api = "0.163.0+26.3"
deps.modmenu = "21.0.0"

[neoforge."26.3"]
# Minecraft and NeoForge ranges in neoforge.mods.toml
mod.mc_compat = "[26.3, 26.4)"
mod.neoforge_compat = "[26.3.0.76,)"
# Oldest Iris the mixins were reviewed for
mod.iris_compat = "[1.11.7,)"
deps.neoforge = "26.3.0.94"

["26.2"]
mod.mc_releases = ["26.2"]

[fabric."26.2"]
mod.mc_compat = "~26.2"
deps.fabric_api = "0.161.0+26.2"
deps.modmenu = "20.0.3"

[neoforge."26.2"]
mod.mc_compat = "[26.2, 26.3)"
mod.neoforge_compat = "[26.2.0.57,)"
mod.iris_compat = "[1.11.4,)"
deps.neoforge = "26.2.0.93"

["26.1.2"]
# Only 26.1.2 is built and tested (26.1 and 26.1.1 were replaced by it in April 2026)
mod.mc_releases = ["26.1.2"]

[fabric."26.1.2"]
mod.mc_compat = "~26.1.2"
deps.fabric_api = "0.155.3+26.1.2"
deps.modmenu = "18.0.2"

[neoforge."26.1.2"]
mod.mc_compat = "[26.1.2, 26.2)"
mod.neoforge_compat = "[26.1.2.71,)"
mod.iris_compat = "[1.11.4,)"
deps.neoforge = "26.1.2.122"
